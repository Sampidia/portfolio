<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>404 - Page Not Found | AFIGO-SAM TECHNOLOGY</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-size: 6rem;
            margin: 0;
            color: #ff451b;
            font-weight: 800;
        }
        h2 {
            font-size: 1.8rem;
            margin: 10px 0 20px;
        }
        p {
            color: #aaa;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        a.btn {
            display: inline-block;
            background: #ff451b;
            color: #fff;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        a.btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for doesn't exist, has been removed, or is temporarily unavailable.</p>
        <a href="https://portfolio.sampidia.com/" class="btn">Return to Home</a>
    </div>
</body>
</html>
